name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r docker/medreason/requirements.txt

      - name: Byte-compile sources
        run: |
          python -m compileall -q \
            medreason_baseline \
            docker/medreason/medreason_docker \
            docker/medreason/process.py \
            docker/medreason/tools \
            scripts \
            finetune \
            tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
